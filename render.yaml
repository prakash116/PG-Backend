# Render blueprint for the Pzee API.
#
# Create the service from this file (Render → New → Blueprint), then fill in the
# values marked `sync: false` in the dashboard. Those are secrets and never
# belong in the repository.
services:
  - type: web
    name: pzee-api
    runtime: node
    plan: starter
    region: singapore # Closest to the Supabase ap-southeast database.
    healthCheckPath: /api/health
    # --include=dev is required: NODE_ENV=production makes npm skip
    # devDependencies, and the build needs prisma, @nestjs/cli and typescript.
    # The Prisma client is generated by the postinstall and prebuild scripts,
    # so it cannot be forgotten here.
    # `migrate deploy` applies pending migrations only; it never resets data.
    buildCommand: npm ci --include=dev && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production

      # Render sets PORT itself and the app reads it. HOST is left unset so the
      # app binds 0.0.0.0, which is what a container needs.
      #
      # PUBLIC_BASE_URL must be the host this service actually answers on, since
      # any URL the API hands out is built from it. Change it the day the custom
      # domain exists, not before.
      - key: PUBLIC_BASE_URL
        value: https://pg-backend-pozw.onrender.com

      # Exact browser origins. Bare hostnames and trailing slashes are
      # normalised by the app, but these are already in the right shape.
      - key: CORS_ORIGINS
        value: https://pzee.in,https://www.pzee.in

      - key: AUTH_COOKIE_NAME
        value: pzee_session

      # AUTH_COOKIE_SECURE and AUTH_COOKIE_SAME_SITE are deliberately absent.
      # The app settles them per request, from the request's own Host and
      # Origin, because only the request knows whether it crossed sites. Setting
      # them here — or pasting a local .env into the dashboard — is how the
      # deployed site ended up issuing a Lax cookie no browser would send back,
      # which logs in successfully and then answers "Authentication required".
      #
      # AUTH_COOKIE_DOMAIN is likewise absent, and must stay absent until the
      # API answers on a *.pzee.in host. A Domain the responding host does not
      # belong to makes the browser discard the cookie outright.

      # Leave unset to keep the API docs private. Set to "true" only while you
      # need them.
      - key: ENABLE_SWAGGER
        value: "false"

      # --- Set these in the dashboard, not here ---
      - key: DATABASE_URL # Supabase pooled connection (port 6543)
        sync: false
      - key: DIRECT_URL # Supabase direct connection (port 5432), for migrations
        sync: false
      - key: JWT_SECRET # A fresh 48-byte random string, not the development one
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
